name: CI

on:
  push:
    branches: ["main", "master", "staging", "release/v0.10.0-rc.*"]
    tags:
      - v0.10.0-rc.*
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odyssey
          POSTGRES_PASSWORD: odyssey
          POSTGRES_DB: odyssey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odyssey" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      PG_DSN: postgres://odyssey:odyssey@localhost:5432/odyssey?sslmode=disable
      REDIS_ADDR: localhost:6379
      ODYSSEY_TEST_MODE: "1"
      GOTENBERG_URL: http://127.0.0.1:0
      APP_MASTER_KEY: ci-master-key-not-for-production
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOFLAGS: -mod=readonly
      GOINSECURE: ""
      GONOSUMDB: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Go mod download
        run: go mod download

      - name: Check documentation and release claims
        run: make release-check

      - name: Verify production PDF build tags
        run: make pdf-release-check

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Vet
        run: make vet

      - name: Run sqlc
        run: sqlc generate

      - name: Database migrations
        run: migrate -path migrations -database "$PG_DSN" up

      - name: Seed phase 4
        run: make seed-phase4

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Analytics SSR smoke tests
        run: |
          go test ./internal/analytics/http -run 'Test(DashboardSuccess|PDFExport)'
          go test ./internal/analytics/svg

      # The E2E sweep below needs a real server, so the binary is built once and
      # reused for both the route dump and the run. ODYSSEY_TEST_MODE must be 0
      # or main() returns before serving.
      - name: Build server binary
        run: go build -o bin/odyssey ./cmd/odyssey

      - name: Dump routes
        env:
          ODYSSEY_TEST_MODE: "0"
          ODYSSEY_DUMP_ROUTES: "1"
          SESSION_SECRET: ci-session-secret-not-for-production
          CSRF_SECRET: ci-csrf-secret-not-for-production
        run: |
          ./bin/odyssey > routes.json
          echo "GET page routes discovered:"
          grep -c '"method"' routes.json

      - name: Start application
        env:
          ODYSSEY_TEST_MODE: "0"
          SESSION_SECRET: ci-session-secret-not-for-production
          CSRF_SECRET: ci-csrf-secret-not-for-production
          APP_ADDR: 127.0.0.1:8080
        run: |
          ./bin/odyssey > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "application ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "application failed to become ready"
          cat server.log
          exit 1

      # Screenshots are deliberately not a gate: the HTML assertions catch the
      # same failures without a Gotenberg dependency or image baselines. The
      # job-level GOTENBERG_URL points at a dead port, so it is cleared here.
      - name: E2E route sweep
        env:
          ODYSSEY_E2E_URL: http://127.0.0.1:8080
          # Absolute: go test runs from the package directory, so a relative
          # path would resolve under tests/e2e rather than the workspace.
          ODYSSEY_E2E_ROUTES: ${{ github.workspace }}/routes.json
          GOTENBERG_URL: ""
        run: go test ./tests/e2e/ -run TestRegressionFlow -v -timeout 20m

      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi

      - name: Application logs
        if: failure()
        run: tail -n 300 server.log || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            routes.json
            server.log
          if-no-files-found: ignore
