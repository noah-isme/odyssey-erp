
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
      POSTGRES_DB: odyssey
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  gotenberg:
    image: gotenberg/gotenberg:8
    environment:
      DISABLE_GOOGLE_CHROME: "0"
    ports:
      - "3001:3000"

  app:
    build: .
    command: /app/odyssey
    env_file:
      - .env.example
    environment:
      PG_DSN: postgres://odyssey:odyssey@postgres:5432/odyssey?sslmode=disable
      REDIS_ADDR: redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      ODYSSEY_TEST_MODE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
    ports:
      - "8080:8080"

  worker:
    build: .
    command: /app/worker
    env_file:
      - .env.example
    environment:
      PG_DSN: postgres://odyssey:odyssey@postgres:5432/odyssey?sslmode=disable
      REDIS_ADDR: redis:6379
      ODYSSEY_TEST_MODE: "0"
    depends_on:
      - redis

  setup:
    build: .
    profiles: ["full"]
    env_file:
      - .env.example
    environment:
      PG_DSN: postgres://odyssey:odyssey@postgres:5432/odyssey?sslmode=disable
    command: >-
      sh -c '/app/migrate -path /app/migrations -database "$${PG_DSN}" up && /app/seed'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
