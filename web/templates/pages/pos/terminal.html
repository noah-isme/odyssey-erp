{{ define "pages/pos/terminal.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POS Terminal - Odyssey ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pos-primary: #10b981;
            --pos-dark: #1f2937;
            --pos-light: #f3f4f6;
            --pos-danger: #ef4444;
        }
        body { font-family: 'Outfit', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--pos-light); overflow: hidden; }
        .cart-section { width: 400px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
        .product-section { flex: 1; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .cart-header { padding: 1.5rem; background: var(--pos-dark); color: white; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px dashed #e5e7eb; }
        .cart-total { padding: 1.5rem; background: var(--pos-dark); color: white; display: flex; flex-direction: column; gap: 1rem; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: bold; }
        .pay-btn { background: var(--pos-primary); color: white; border: none; padding: 1rem; font-size: 1.25rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .scanner-bar { display: flex; gap: 1rem; }
        .scanner-input { flex: 1; padding: 1rem; border: 2px solid var(--pos-primary); border-radius: 8px; font-size: 1.1rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; overflow-y: auto; }
        .product-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); cursor: pointer; text-align: center; border: 2px solid transparent; transition: 0.2s; }
        .product-card:hover { border-color: var(--pos-primary); transform: translateY(-2px); }
        .loyalty-btn { background: #3b82f6; color: white; padding: 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="cart-section">
        <div class="cart-header">
            <h2 style="margin: 0;">Current Order</h2>
            <p style="margin: 0.5rem 0 0 0; opacity: 0.8;">Terminal #1 - Operator: Admin</p>
        </div>
        <div class="cart-items" id="cartList">
            <div class="cart-item">
                <div>
                    <strong>Wireless Mouse</strong>
                    <div style="color: #6b7280; font-size: 0.875rem;">1 x $25.00</div>
                </div>
                <strong>$25.00</strong>
            </div>
        </div>
        <div class="cart-total">
            <button class="btn btn--secondary" onclick="scanLoyalty()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-right:6px;"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Scan Loyalty / Gift Card</button>
            <div class="total-row"><span>Total:</span> <span>$25.00</span></div>
            <button class="btn btn--primary" onclick="processPayment()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-right:6px;"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Process Payment</button>
        </div>
    </div>
    
    <div class="product-section">
        <div class="scanner-bar">
            <input type="text" class="form-input" placeholder="Scan barcode..." autofocus>
            <button class="btn btn--primary" style="padding: 1rem 2rem;">Search</button>
        </div>
        <div class="product-grid">
            <div class="product-card" onclick="addToCart('Keyboard', 45.00)">
                <h3 style="margin-top: 0;">Keyboard</h3>
                <p style="color: var(--pos-primary); font-weight: bold; font-size: 1.25rem;">$45.00</p>
            </div>
            <div class="product-card" onclick="addToCart('Monitor', 199.00)">
                <h3 style="margin-top: 0;">Monitor</h3>
                <p style="color: var(--pos-primary); font-weight: bold; font-size: 1.25rem;">$199.00</p>
            </div>
        </div>
    </div>

    <script>
        function addToCart(name, price) {
            document.getElementById('cartList').innerHTML += `
            <div class="cart-item">
                <div>
                    <strong>${name}</strong>
                    <div style="color: #6b7280; font-size: 0.875rem;">1 x $${price.toFixed(2)}</div>
                </div>
                <strong>$${price.toFixed(2)}</strong>
            </div>`;
        }
        function scanLoyalty() { alert('Waiting for loyalty or gift card swipe...'); }
        function processPayment() { alert('Printing receipt and opening cash drawer...'); document.getElementById('cartList').innerHTML = ''; }
    </script>
</body>
</html>
{{ end }}
