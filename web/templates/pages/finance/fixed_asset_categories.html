{{ define "pages/finance/fixed_asset_categories.html" }}{{ template "layouts/base.html" . }}{{ end }}
{{ define "title" }}Fixed asset categories{{ end }}
{{ define "content" }}<div class="page-container"><header class="page-header"><div class="page-header__content"><h1 class="page-title">Fixed asset categories</h1><p class="page-subtitle">Configure depreciation and disposal accounts.</p></div></header><form method="post" action="/accounting/fixed-assets/categories" class="card p-4 form-grid"><input type="hidden" name="csrf_token" value="{{ .CSRFToken }}"><div class="form-group"><label class="form-label">Code</label><input class="form-input" name="code" required></div><div class="form-group"><label class="form-label">Name</label><input class="form-input" name="name" required></div><div class="form-group"><label class="form-label">Asset account</label><select class="form-select" name="asset_account_id">{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Accumulated depreciation</label><select class="form-select" name="accumulated_depreciation_account_id">{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Depreciation expense</label><select class="form-select" name="depreciation_expense_account_id">{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Cash proceeds</label><select class="form-select" name="cash_proceeds_account_id"><option value="">None</option>{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Disposal gain</label><select class="form-select" name="disposal_gain_account_id"><option value="">None</option>{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Disposal loss</label><select class="form-select" name="disposal_loss_account_id"><option value="">None</option>{{ range .Data.Accounts }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Useful life (months)</label><input class="form-input" type="number" name="useful_life_months" required></div><div class="form-group"><label class="form-label">Residual rate %</label><input class="form-input" type="number" step="0.01" name="residual_rate" value="0"></div><button class="btn btn--primary">Create category</button></form></div>{{ end }}
