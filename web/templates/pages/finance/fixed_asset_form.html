{{ define "pages/finance/fixed_asset_form.html" }}{{ template "layouts/base.html" . }}{{ end }}
{{ define "title" }}New fixed asset{{ end }}
{{ define "content" }}<div class="page-container"><header class="page-header"><div class="page-header__content"><h1 class="page-title">New fixed asset</h1></div></header><form method="post" action="/accounting/fixed-assets" class="card p-4 form-grid"><input type="hidden" name="csrf_token" value="{{ .CSRFToken }}"><div class="form-group"><label class="form-label">Category</label><select class="form-select" name="category_id">{{ range .Data.Categories }}<option value="{{ .ID }}">{{ .Code }} — {{ .Name }}</option>{{ end }}</select></div><div class="form-group"><label class="form-label">Asset number</label><input class="form-input" name="number" required></div><div class="form-group"><label class="form-label">Name</label><input class="form-input" name="name" required></div><div class="form-group"><label class="form-label">In service</label><input class="form-input" type="date" name="in_service_date" required></div><div class="form-group"><label class="form-label">Acquisition cost</label><input class="form-input" type="number" step="0.01" name="acquisition_cost" required></div><div class="form-group"><label class="form-label">Useful life (months)</label><input class="form-input" type="number" name="useful_life_months" required></div><button class="btn btn--primary">Register asset</button></form></div>{{ end }}
