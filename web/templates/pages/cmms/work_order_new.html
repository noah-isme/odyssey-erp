{{ define "pages/cmms/work_order_new.html" }}
{{ template "layouts/base.html" . }}
{{ end }}

{{ define "title" }}Work Order New{{ end }}

{{ define "content" }}
<div class="container mt-4 max-w-4xl mx-auto">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white py-3">
      <h2 class="h5 mb-0"><i class="bi bi-tools"></i> Create Work Order</h2>
    </div>
    <div class="card-body p-4">
      <form action="/cmms/work-orders" method="POST">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        
        <div class="mb-3">
          <label class="form-label fw-bold">Title</label>
          <input type="text" name="title" class="form-input" required placeholder="Brief description of the issue">
        </div>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea name="description" class="form-textarea" rows="4" placeholder="Detailed instructions..."></textarea>
        </div>
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Asset</label>
            <select name="asset_id" class="form-select">
              <option value="">-- None --</option>
              {{ range .Data.Assets }}
              <option value="{{ .ID }}">{{ .Code }} - {{ .Name }}</option>
              {{ end }}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Location</label>
            <select name="location_id" class="form-select">
              <option value="">-- None --</option>
              {{ range .Data.Locations }}
              <option value="{{ .ID }}">{{ .Code }} - {{ .Name }}</option>
              {{ end }}
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Priority</label>
            <select name="priority" class="form-select">
              {{ range .Data.Priorities }}
              <option value="{{ . }}">{{ . }}</option>
              {{ end }}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Category</label>
            <select name="category" class="form-select">
              {{ range .Data.Categories }}
              <option value="{{ . }}">{{ . }}</option>
              {{ end }}
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="/cmms/work-orders" class="btn btn-light border">Cancel</a>
          <button type="submit" class="btn btn-primary">Create Work Order</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
