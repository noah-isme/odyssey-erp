{{ define "pages/boardpacks/new.html" }}
{{ template "layouts/base.html" . }}
{{ end }}

{{ define "title" }}Generate Board Pack{{ end }}

{{ define "content" }}
<div class="page-container form-page">
<header class="page-header"><div class="page-header__content"><h1 class="page-title">Generate Board Pack</h1><p class="page-subtitle">Pilih perusahaan, periode, dan template untuk mengantrekan laporan eksekutif.</p></div><div class="page-header__actions"><a href="/board-packs" class="btn btn--secondary">Kembali</a></div></header>
<section class="card"><form method="post" action="/board-packs">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <div class="form-section"><div class="form-grid"><div class="form-group"><label class="form-label" for="company_id">Company</label>
            <select class="form-select" name="company_id" required>
                <option value="">-- pilih --</option>
                {{ range $c := .Data.Companies }}
                    <option value="{{ $c.ID }}" {{ if eq $.Data.SelectedCompany $c.ID }}selected{{ end }}>{{ $c.Name }}</option>
                {{ end }}
            </select></div><div class="form-group"><label class="form-label" for="period_id">Accounting Period</label>
            <select class="form-select" name="period_id" required>
                <option value="">-- pilih --</option>
                {{ range $p := .Data.Periods }}
                    <option value="{{ $p.ID }}">{{ $p.Name }} ({{ formatDate $p.StartDate }} – {{ formatDate $p.EndDate }})</option>
                {{ end }}
            </select></div><div class="form-group"><label class="form-label" for="template_id">Template</label>
            <select class="form-select" name="template_id" required>
                {{ range $tpl := .Data.Templates }}
                    <option value="{{ $tpl.ID }}">{{ $tpl.Name }}</option>
                {{ end }}
            </select></div><div class="form-group"><label class="form-label" for="variance_snapshot_id">Variance Snapshot (opsional)</label>
            <select class="form-select" name="variance_snapshot_id">
                <option value="">-- skip --</option>
                {{ range $snap := .Data.Snapshots }}
                    <option value="{{ $snap.ID }}">#{{ $snap.ID }} – {{ $snap.RuleName }}</option>
                {{ end }}
            </select></div></div></div>
        <div class="form-section"><div class="form-group"><label class="form-label" for="note">Catatan</label><textarea class="form-textarea" id="note" name="note" rows="2" placeholder="Catatan singkat untuk eksekutif"></textarea></div></div>
        <footer class="form-footer"><button type="submit" class="btn btn--primary">Antrekan Board Pack</button></footer>
    </form></section>
</div>
{{ end }}
