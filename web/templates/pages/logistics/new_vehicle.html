{{ define "pages/logistics/new_vehicle.html" }}
{{ template "layouts/base.html" . }}
{{ end }}

{{ define "title" }}Register Vehicle{{ end }}

{{ define "content" }}
<div class="page-container">
    <header class="page-header">
        <div class="page-header__content">
            <h1 class="page-title">Register Vehicle</h1>
            <p class="page-subtitle">Add a new transport unit to your fleet.</p>
        </div>
        <div class="page-header__actions">
            <a href="/logistics/fleet" class="btn btn--secondary">Cancel</a>
        </div>
    </header>

    <div class="page-content">
        <div class="card card--lg">
            <form method="post" action="/logistics/fleet/new">
                {{ .Data.CSRFField }}

                <div class="card__header">
                    <h2 class="card__title">Vehicle Details</h2>
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="registration">Vehicle Registration ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-input" id="registration" name="registration" required placeholder="e.g. V-2024-005">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="type">Vehicle Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="VAN">Van</option>
                            <option value="TRUCK">Truck</option>
                            <option value="LORRY">Lorry</option>
                            <option value="CAR">Car</option>
                            <option value="BIKE">Bike</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="license_plate">License Plate <span class="text-danger">*</span></label>
                        <input type="text" class="form-input" id="license_plate" name="license_plate" required placeholder="e.g. B 1234 CD">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="fleet_id">Fleet Assignment <span class="text-danger">*</span></label>
                        <select class="form-select" id="fleet_id" name="fleet_id" required>
                            {{ range .Data.Fleets }}
                                <option value="{{ .ID }}">{{ .FleetName }}</option>
                            {{ else }}
                                <option value="1">Main Fleet (Default)</option>
                            {{ end }}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="make">Make</label>
                        <input type="text" class="form-input" id="make" name="make" placeholder="e.g. Hino">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="model">Model</label>
                        <input type="text" class="form-input" id="model" name="model" placeholder="e.g. Dutro">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="max_weight">Max Weight (kg)</label>
                        <input type="number" step="0.1" class="form-input" id="max_weight" name="max_weight" placeholder="e.g. 5000">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="vin">VIN Number</label>
                        <input type="text" class="form-input" id="vin" name="vin" placeholder="Vehicle Identification Number">
                    </div>
                </div>

                <div class="card__footer" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn--primary">Register Vehicle</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
