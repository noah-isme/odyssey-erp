{{ define "pages/inventory/adjustment_form.html" }}
{{ template "layouts/base.html" . }}
{{ end }}

{{ define "title" }}Buat Penyesuaian Stok{{ end }}

{{ define "content" }}
<div class="container container-narrow">
    <header class="page-header">
        <div class="header-main">
            <h1>Buat Penyesuaian</h1>
            <p class="text-muted">Mulai dokumen penyesuaian stok baru.</p>
        </div>
    </header>

    <div class="card">
        <form action="/inventory/adjustments" method="POST" class="form">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            
            <div class="form-group">
                <label for="warehouse_id">Gudang</label>
                <select name="warehouse_id" id="warehouse_id" class="form-select" required>
                    <option value="">Pilih Gudang...</option>
                    {{ range .Data.Warehouses }}
                    <option value="{{ .ID }}">{{ .Name }}</option>
                    {{ end }}
                </select>
            </div>

            <div class="form-group">
                <label for="adjustment_at">Tanggal Penyesuaian</label>
                <input type="date" name="adjustment_at" id="adjustment_at" class="form-input" value="{{ now | formatDateInput }}" required>
            </div>

            <div class="form-group">
                <label for="note">Catatan / Alasan</label>
                <textarea name="note" id="note" class="form-textarea" rows="3" placeholder="Contoh: Koreksi barang rusak saat bongkar muat"></textarea>
            </div>

            <div class="form-footer">
                <a href="/inventory/adjustments" class="btn btn--ghost">Batal</a>
                <button type="submit" class="btn btn--primary">Lanjut ke Item</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
