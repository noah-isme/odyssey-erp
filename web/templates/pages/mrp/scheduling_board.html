{{ define "pages/mrp/scheduling_board.html" }}{{ template "layouts/base.html" . }}{{ end }}
{{ define "title" }}Scheduling board{{ end }}
{{ define "content" }}<div class="page-container"><header class="page-header"><h1 class="page-title">Scheduling board</h1><button id="schedule" class="btn btn--primary">Run finite schedule</button></header><section class="card"><div class="card__body"><pre id="board">Loading operations…</pre></div></section></div><script>async function load(){const r=await fetch('/mrp/dispatch');const x=await r.json();board.textContent=x.map(o=>'WC '+o.work_center_id+' | '+o.name+' | '+o.status).join('\n')||'No dispatchable operations'}document.getElementById('schedule').onclick=async()=>{const r=await fetch('/mrp/scheduling/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)alert(await r.text());load()};load()</script>{{ end }}
