{{ define "partials/masterdata/detail.html" }}
<div class="page-container">
    {{ template "partials/ui/page_header.html" . }}

    <div class="page-content">
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">Rincian data / Record details</h2>
            </div>
            <div class="card__body p-6">
                <dl class="form-grid">
                    {{ template "masterdata-detail-fields" . }}
                </dl>
            </div>
            <div class="card__footer flex justify-end">
                <button type="button" class="btn btn--danger" data-dialog-open="delete-record-dialog">Hapus / Delete</button>
            </div>
        </section>
    </div>
</div>

<dialog id="delete-record-dialog" class="native-dialog" data-dialog aria-labelledby="delete-record-dialog-title">
    <div class="native-dialog__content">
        <header class="native-dialog__header">
            <h2 id="delete-record-dialog-title" class="native-dialog__title">Hapus data / Delete record</h2>
        </header>
        <div class="native-dialog__body p-6">
            <p>This action cannot be undone. Confirm that you want to delete this record.</p>
        </div>
        <form method="post" action="{{ template "masterdata-detail-delete-url" . }}">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <footer class="native-dialog__footer">
                <button type="button" class="btn btn--secondary" data-dialog-close>Batal / Cancel</button>
                <button type="submit" class="btn btn--danger">Hapus / Delete</button>
            </footer>
        </form>
    </div>
</dialog>
{{ end }}
