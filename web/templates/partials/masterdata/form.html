{{ define "partials/masterdata/form.html" }}
<div class="page-container">
    {{ template "partials/ui/page_header.html" . }}

    <div class="page-content">
        {{ with index .Data.Errors "general" }}
        <div class="feedback feedback--error" role="alert">
            <div class="feedback__content">{{ . }}</div>
        </div>
        {{ end }}

        <section class="card">
            <form method="post" action="{{ template "masterdata-form-action" . }}" data-component="form">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <div class="form-section">
                    {{ template "masterdata-form-fields" . }}
                </div>
                <div class="card__footer flex justify-end gap-3">
                    <a class="btn btn--secondary" href="{{ template "masterdata-form-cancel-url" . }}">Cancel</a>
                    <button type="submit" class="btn btn--primary">Save</button>
                </div>
            </form>
        </section>
    </div>
</div>
{{ end }}
