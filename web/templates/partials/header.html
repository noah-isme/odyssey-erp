{{ define "partials/header.html" }}
<header class="app-header">
    <div class="header-left">
        <button class="btn btn--icon btn--ghost sidebar-toggle" data-sidebar-toggle aria-label="Toggle sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18" />
            </svg>
        </button>
        <a href="/" class="header-brand" aria-label="Odyssey ERP dashboard">
            <span class="header-brand__mark">O</span>
            <span class="header-brand__name">Odyssey</span>
        </a>
        <nav class="breadcrumbs">
            <span class="breadcrumbs-separator">/</span>
            <span>{{ if .Title }}{{ .Title }}{{ else }}Dashboard{{ end }}</span>
        </nav>
    </div>

    <div class="header-center">
        <div class="global-search" id="global-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input class="form-input" type="text" id="global-search-input" placeholder="Cari pelanggan, pesanan, atau invoice..." autocomplete="off" />
            <span class="global-search-shortcut">Ctrl K</span>
            <div class="global-search-results" id="global-search-results" hidden></div>
        </div>
    </div>

    <div class="header-right">
        <form method="post" action="/company/select" class="header-company-select" data-company-select-form>
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <label class="sr-only" for="active-company">Perusahaan aktif</label>
            <select id="active-company" name="company_id" class="form-select form-select--sm" data-active-company aria-label="Perusahaan aktif" disabled>
                <option value="">Memuat perusahaan...</option>
            </select>
        </form>
        <!-- Create Dropdown -->
        <button class="btn btn--primary header-btn" data-dropdown-trigger="create" aria-expanded="false" aria-haspopup="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
            </svg>
            <span data-i18n="create">Buat Baru</span>
        </button>
        <div class="dropdown-menu" data-dropdown="create" hidden aria-hidden="true">
            <a href="/sales/quotations/new" class="dropdown-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                Penawaran Baru
            </a>
            <a href="/sales/orders/new" class="dropdown-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                </svg>
                Sales Order Baru
            </a>
            <a href="/procurement/pos/new" class="dropdown-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                </svg>
                Purchase Order Baru
            </a>
            <a href="/sales/customers/new" class="dropdown-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <line x1="19" y1="8" x2="19" y2="14" />
                    <line x1="22" y1="11" x2="16" y2="11" />
                </svg>
                Pelanggan Baru
            </a>
        </div>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="btn btn--icon btn--ghost theme-toggle" data-theme-toggle aria-label="Toggle theme"
            title="Toggle light/dark mode">
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
        </button>

        <div class="notification-menu" data-notification-control>
            <button class="btn btn--icon btn--ghost header-btn-icon" data-notification-trigger aria-label="Notifications" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="notification-badge" data-notification-count hidden>0</span>
            </button>
            <div class="dropdown-menu notification-dropdown" data-notification-dropdown hidden>
                <div class="notification-dropdown__header">
                    <strong>Notifications</strong>
                    <button type="button" class="btn btn--ghost btn--sm" data-notification-read-all>Mark all read</button>
                </div>
                <div data-notification-list><p class="notification-empty">No recent notifications.</p></div>
            </div>
        </div>

        <!-- User Dropdown -->
        <div class="user-menu-wrapper">
            <button class="btn btn--ghost user-menu" data-dropdown-trigger="user" aria-expanded="false" aria-haspopup="true">
                <div class="user-avatar" data-current-user-avatar>U</div>
                <span class="user-name" data-current-user-name>Pengguna</span>
                <svg class="user-menu__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </button>
            <div class="dropdown-menu user-dropdown" data-dropdown="user" hidden aria-hidden="true">
                <div class="user-dropdown__identity">
                    <div class="user-avatar user-avatar--lg" data-current-user-avatar>U</div>
                    <div class="user-dropdown__meta">
                        <strong class="user-dropdown__name" data-current-user-name>Pengguna</strong>
                        <span class="user-dropdown__email" data-current-user-email>—</span>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <a href="/profile" class="dropdown-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span data-i18n="profile">Profil</span>
                </a>
                <a href="/settings" class="dropdown-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="21" x2="4" y2="14" />
                        <line x1="4" y1="10" x2="4" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="12" />
                        <line x1="12" y1="8" x2="12" y2="3" />
                        <line x1="20" y1="21" x2="20" y2="16" />
                        <line x1="20" y1="12" x2="20" y2="3" />
                        <line x1="1" y1="14" x2="7" y2="14" />
                        <line x1="9" y1="8" x2="15" y2="8" />
                        <line x1="17" y1="16" x2="23" y2="16" />
                    </svg>
                    <span data-i18n="settings">Pengaturan</span>
                </a>
                <a href="/auth/mfa/setup" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                    <span>Setup MFA</span>
                </a>
                
                <div class="dropdown-divider"></div>

                <form action="/auth/logout" method="post" style="margin:0;">
                    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                    <button type="submit" class="btn btn--danger btn--block" style="display: flex; align-items: center; justify-content: flex-start; gap: 0.5rem;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span data-i18n="logout">Keluar</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
{{ end }}
