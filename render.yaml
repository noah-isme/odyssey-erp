services:
  - type: web
    name: odyssey-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c '/app/migrate -path /app/migrations -database "$PG_DSN" up && exec /app/odyssey'
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ADDR
        value: :10000
      - key: LOG_FORMAT
        value: json
      - key: PG_DSN
        fromDatabase:
          name: odyssey-postgres
          property: connectionString
      - key: REDIS_ADDR
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: GOTENBERG_URL
        sync: false
      - key: BOARD_PACK_STORAGE_DRIVER
        value: s3
      - key: BOARD_PACK_S3_ENDPOINT
        sync: false
      - key: BOARD_PACK_S3_REGION
        sync: false
      - key: BOARD_PACK_S3_BUCKET
        sync: false
      - key: BOARD_PACK_S3_ACCESS_KEY_ID
        sync: false
      - key: BOARD_PACK_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BOARD_PACK_S3_USE_PATH_STYLE
        value: true
      - key: BOARD_PACK_S3_AUTO_CREATE_BUCKET
        value: false

databases:
  - name: odyssey-postgres
    databaseName: odyssey
    user: odyssey
    region: singapore
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
